[project]
name = "control-machine"
version = "0.1.0"
description = "Browser-controlling LangGraph Deep Agent with a Postgres backend and live dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.2",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-ollama>=1.0",
    "langchain-openai>=0.3",
    "psycopg[binary,pool]>=3.2",
    "playwright>=1.60",
    "pillow>=11.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "sse-starlette>=2.1",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.28.1",
    "croniter>=3.0",
    "python-telegram-bot>=21.6",
    "websockets>=14.0",
    "typesafe-sdk>=0.7.2",
]

[project.scripts]
control-machine = "control_machine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_machine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
